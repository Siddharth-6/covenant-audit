<text x="6" y="273.0" font-size="11" font-weight="bold" fill="#c77700">AI</text>
<text x="6" y="286.0" font-size="9" fill="#c77700">probabilistic</text>
<rect x="1" y="304" width="838" height="54" fill="#e8f1fb" stroke="#1f5fa8"/>
<text x="6" y="329.0" font-size="11" font-weight="bold" fill="#1f5fa8">CODE</text>
