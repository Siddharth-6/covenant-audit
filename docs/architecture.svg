<text x="299.0" y="342.0" font-size="11.5" text-anchor="middle">tie-outs, scale</text>
<rect x="386.0" y="311.0" width="138.0" height="40" rx="4" fill="white" stroke="#1f5fa8" stroke-width="1.6"/>
