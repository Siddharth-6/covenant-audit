<text x="151.0" y="206" font-size="10" fill="#555">approved, hashed spec drives every quarterly test</text>
<text x="420.0" y="433" font-size="10.5" fill="#b00020" text-anchor="middle">STALE: an amendment, restatement or revoked spec re-opens Lane A and re-queues dependent results</text>
